kind = "web"
previewPath = "/"
title = "XXXVII — The 37"
description = "A dark, cinematic, minimalist portfolio-style website for XXXVII ('The 37') — a browsable atlas of 37 causes across 10 dimensions of human existence, featuring a scroll-driven expanding image gallery, cause detail pages, dimension chapter panels, an infos page, and a contact/claim-a-cause form."
version = "1.0.0"
id = "artifacts/the37"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24835

[services.development]
run = "pnpm --filter @workspace/the37 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/the37", "run", "build" ]
serve = "static"
publicDir = "artifacts/the37/dist/public"

# Prerendered section routes — must come before the SPA catch-all so the
# static file server reaches the fully-populated index.html for each route.
[[services.production.rewrites]]
from = "/atlas"
